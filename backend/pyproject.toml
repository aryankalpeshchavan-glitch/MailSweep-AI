[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    # Third-party deprecations we cannot fix; surfaced in CI logs anyway.
    "ignore::DeprecationWarning:google.*",
    "ignore::DeprecationWarning:cachetools.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "B008", # function-call-in-default-argument: FastAPI's Depends() pattern
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use asserts and fixtures with loose typing.
"tests/*" = ["B011", "B008"]

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/celery_app.py"]

[tool.coverage.report]
show_missing = true
precision = 1
